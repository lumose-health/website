name: CI

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    # This job name is the required status check on main and is consumed by
    # renovate-automerge.yml's merge gate — do not rename it casually.
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Runs before the sync step so tests read the committed src/data files,
      # not the ones the sync regenerates.
      - name: Unit tests
        run: npm test

      - name: Sync docs and generate Fumadocs source
        run: npm run sync-docs && npm run sync-contributors && npm run sync-releases && npm run sync-roadmap && npx fumadocs-mdx
        env:
          DOCS_NO_CACHE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npx eslint src/

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
        env:
          DOCS_NO_CACHE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Marks this build as a preview so layout.tsx emits a noindex robots
          # meta tag and renders the PreviewBanner. Production builds (deploy.yml,
          # docs-rebuild.yml) intentionally do not set this.
          NEXT_PUBLIC_BUILD_ENV: preview

      - name: Deploy preview to Cloudflare Pages
        id: preview-deploy
        # Forks cannot access repo secrets, so skip preview deploys on fork PRs.
        # The main check (lint/typecheck/build above) still runs for them.
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=lumose --branch=pr-${{ github.event.number }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Generate token for glycemicgpt-ci (preview comment)
        id: ci-token
        if: steps.preview-deploy.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Post preview URL to PR
        if: steps.preview-deploy.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.preview-deploy.outputs.deployment-url }}
          ALIAS_URL: https://pr-${{ github.event.number }}.lumose.pages.dev
        with:
          github-token: ${{ steps.ci-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- preview-deploy-comment -->';
            const prNumber = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;
            const aliasUrl = process.env.ALIAS_URL;

            const body = [
              marker,
              '## :rocket: Preview deployment',
              '',
              `**Stable alias:** ${aliasUrl}`,
              `**This deployment:** ${previewUrl}`,
              '',
              'The stable alias points to the latest push on this PR; the deployment URL is pinned to this specific commit. Cloudflare Pages cleans both up when the PR is closed.',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              ...context.repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.data.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: prNumber, body,
              });
            }

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/check-v2.sh diffs the live page files against origin/main,
          # which needs the branch history and the origin/main ref.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (prebuild hook syncs docs from source repos)
        run: npx next build
        env:
          DOCS_NO_CACHE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Needs the build above: one without the preview flag. Fails the job if
      # /v2 is indexable or linked from live pages, or if live pages changed.
      - name: Check /v2 stays hidden and live pages are untouched
        id: check-v2
        run: bash scripts/check-v2.sh

      - name: Generate token for glycemicgpt-ci
        id: ci-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Run Lighthouse
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: .lighthouserc.json
          # The action passes this on the command line, so it wins over
          # numberOfRuns in the config. Keep the two the same.
          runs: 3

      - name: Post Lighthouse scores to PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
          CHECK_V2_OUTCOME: ${{ steps.check-v2.outcome }}
        with:
          github-token: ${{ steps.ci-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;

            const marker = '<!-- lighthouse-comment -->';
            const repo = context.repo;
            const lhciDir = '.lighthouseci';
            const categories = [
              ['performance', 'Performance'],
              ['accessibility', 'Accessibility'],
              ['best-practices', 'Best Practices'],
              ['seo', 'SEO'],
            ];

            const readJson = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));

            // Same rule LHCI uses for "aggregationMethod": "median".
            const median = (values) => {
              const sorted = [...values].sort((a, b) => a - b);
              const mid = Math.floor((sorted.length - 1) / 2);
              return sorted.length % 2 ? sorted[mid] : (sorted[mid] + sorted[mid + 1]) / 2;
            };

            // The result files and .lighthouserc.json come from the PR, so no
            // string from them goes into the comment. Pages are named from this
            // list, and values are printed only as numbers. Add a page here
            // when one is added to the config.
            const knownPages = new Map([
              ['/index.html', '/'],
              ['/v2.html', '/v2'],
            ]);
            const pageLabel = (url) => {
              try { return knownPages.get(new URL(url).pathname) ?? null; } catch { return null; }
            };

            // One entry per audited URL, in the order the runs were collected.
            const pages = new Map();
            try {
              const files = fs.readdirSync(lhciDir).filter(f => /^lhr-\d+\.json$/.test(f)).sort();
              for (const file of files) {
                const lhr = readJson(path.join(lhciDir, file));
                const url = lhr.requestedUrl || lhr.finalDisplayedUrl || lhr.finalUrl;
                if (!url || pageLabel(url) === null) {
                  console.log(`Skipping ${file}: not one of the known pages`);
                  continue;
                }
                if (!pages.has(url)) pages.set(url, []);
                pages.get(url).push(lhr);
                const audit = (id) => lhr.audits?.[id]?.numericValue;
                console.log(
                  `${pageLabel(url)} ${file}: performance ${lhr.categories?.performance?.score}, ` +
                  `TBT ${audit('total-blocking-time')} ms, LCP ${audit('largest-contentful-paint')} ms, ` +
                  `CLS ${audit('cumulative-layout-shift')}`
                );
              }
            } catch (e) {
              console.log('Could not parse Lighthouse results:', e.message);
            }

            // Thresholds come from the config LHCI asserted with, so the
            // comment cannot drift from it.
            let matrix = [];
            try {
              const assert = readJson('.lighthouserc.json').ci?.assert || {};
              matrix = assert.assertMatrix
                || (assert.assertions ? [{ matchingUrlPattern: '.*', assertions: assert.assertions }] : []);
            } catch (e) {
              console.log('Could not read .lighthouserc.json:', e.message);
            }

            function rulesFor(url, key) {
              const rules = [];
              for (const entry of matrix) {
                let matches = false;
                try { matches = new RegExp(entry.matchingUrlPattern || '.*').test(url); } catch {}
                if (!matches) continue;
                const rule = entry.assertions?.[`categories:${key}`];
                if (!Array.isArray(rule) || typeof rule[1]?.minScore !== 'number') continue;
                if (rule[0] !== 'error' && rule[0] !== 'warn') continue;
                rules.push({ level: rule[0], min: rule[1].minScore });
              }
              // Errors first, then the higher bar first.
              return rules.sort((a, b) => (a.level === b.level ? b.min - a.min : a.level === 'error' ? -1 : 1));
            }

            const pct = (score) => Math.round(score * 100);

            function cell(url, key, lhrs) {
              const values = lhrs.map(l => l.categories?.[key]?.score).filter(v => typeof v === 'number');
              if (values.length === 0) return '?';
              const score = median(values);
              const rules = rulesFor(url, key);
              if (rules.length === 0) return `${pct(score)} (not checked)`;
              const missed = rules.filter(r => score < r.min);
              const error = missed.find(r => r.level === 'error');
              if (error) return `${pct(score)} ❌ (min ${pct(error.min)})`;
              if (missed.length > 0) return `${pct(score)} ⚠️ (target ${pct(missed[0].min)})`;
              return `${pct(score)} ✅`;
            }

            const rows = [];
            const thresholdLines = [];
            const runLines = [];
            for (const [url, lhrs] of pages) {
              const label = pageLabel(url);
              rows.push(`| \`${label}\` | ${categories.map(([key]) => cell(url, key, lhrs)).join(' | ')} |`);

              const parts = [];
              for (const [key, name] of categories) {
                const rules = rulesFor(url, key);
                if (rules.length === 0) continue;
                parts.push(`${name} ${rules.map(r => `>= ${pct(r.min)} (${r.level === 'error' ? 'blocks PR' : 'warning only'})`).join(', ')}`);
              }
              if (parts.length > 0) thresholdLines.push(`- \`${label}\`: ${parts.join('; ')}`);

              const perf = lhrs.map(l => l.categories?.performance?.score).filter(v => typeof v === 'number');
              if (perf.length > 1) runLines.push(`\`${label}\` ${perf.map(pct).join(', ')}`);
            }

            // Failed assertions on single metrics (blocking time and so on).
            // Category scores are already in the table.
            const metricLines = [];
            try {
              const operators = ['<=', '>=', '=='];
              const number = (value) => {
                const n = typeof value === 'number' ? value : Number.NaN;
                return Number.isFinite(n) ? String(Number(n.toPrecision(4))) : 'n/a';
              };
              for (const r of readJson(path.join(lhciDir, 'assertion-results.json'))) {
                if (r.passed || r.auditId === 'categories') continue;
                const label = pageLabel(r.url);
                if (label === null || typeof r.auditId !== 'string' || !/^[a-z0-9-]+$/.test(r.auditId)) {
                  console.log('Skipping an assertion result with an unexpected page or audit id');
                  continue;
                }
                const icon = r.level === 'error' ? '❌' : '⚠️';
                const operator = operators.includes(r.operator) ? `${r.operator} ` : '';
                metricLines.push(`- ${icon} \`${label}\` ${r.auditId}: ${number(r.actual)} (expected ${operator}${number(r.expected)})`);
              }
            } catch (e) {
              console.log('Could not read assertion results:', e.message);
            }

            const outcome = process.env.LHCI_OUTCOME;
            const emoji = outcome === 'success' ? '✅' : '⚠️';

            const body = [marker, `## 🔦 Lighthouse Audit ${emoji}`, ''];
            if (process.env.CHECK_V2_OUTCOME === 'failure') {
              body.push('The site checks (`scripts/check-v2.sh`) failed, so Lighthouse did not run. The failing checks are listed in the job log.');
            } else if (rows.length === 0) {
              body.push('No Lighthouse results were found. See the job log.');
            } else {
              body.push(
                `| Page | ${categories.map(([, name]) => name).join(' | ')} |`,
                `|------|${categories.map(() => '------').join('|')}|`,
                ...rows,
                '',
                'Each score is the median of the runs for that page.',
              );
              if (runLines.length > 0) body.push(`Performance per run: ${runLines.join('; ')}.`);
              if (metricLines.length > 0) body.push('', '**Metrics outside their limits:**', ...metricLines);
              if (thresholdLines.length > 0) body.push('', '**Thresholds:**', ...thresholdLines);
            }

            // Upsert comment
            const comments = await github.rest.issues.listComments({
              ...repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.data.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...repo, comment_id: existing.id, body: body.join('\n') });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: prNumber, body: body.join('\n') });
            }

  autolabeler:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CONFIG_PATH: .github/autolabeler-config.json

    steps:
      - name: Generate token for glycemicgpt-ci
        id: ci-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install minimatch

      - name: Label PR based on file changes and conventions
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.ci-token.outputs.token }}
          script: |
            const fs = require('fs').promises;
            const path = require('path');
            const { minimatch } = require('minimatch');

            const configPath = path.resolve(process.env.CONFIG_PATH);
            const fileContent = await fs.readFile(configPath, 'utf-8');
            const autolabelerConfig = JSON.parse(fileContent);

            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const prBody = context.payload.pull_request.body || "";

            let labelsToAdd = new Set();

            const prListFilesResponse = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const prFiles = prListFilesResponse.data;

            for (const [label, rules] of Object.entries(autolabelerConfig)) {
              const shouldAddLabel = prFiles.some((prFile) => {
                return rules.some((rule) => {
                  const isFileStatusMatch = rule.fileStatus ? rule.fileStatus === prFile.status : true;
                  const isIncludeGlobMatch = rule.includeGlobs.length === 0 ||
                    rule.includeGlobs.some((glob) => minimatch(prFile.filename, glob));
                  const isExcludeGlobMatch = rule.excludeGlobs.some((glob) => minimatch(prFile.filename, glob));
                  return isFileStatusMatch && isIncludeGlobMatch && !isExcludeGlobMatch;
                });
              });
              if (shouldAddLabel) {
                labelsToAdd.add(label);
              }
            }

            const typeLabels = {
              'feat': 'feature', 'fix': 'bugfix', 'docs': 'documentation',
              'style': 'style', 'refactor': 'refactor', 'perf': 'performance',
              'test': 'tests', 'build': 'build', 'ci': 'ci', 'chore': 'chore', 'revert': 'revert'
            };

            const typeMatch = prTitle.match(/^(\w+)(\(.+\))?!?:/);
            if (typeMatch) {
              const commitType = typeMatch[1].toLowerCase();
              if (typeLabels[commitType]) labelsToAdd.add(typeLabels[commitType]);
              if (prTitle.includes('!:') || prBody.toLowerCase().includes('breaking change')) {
                labelsToAdd.add('breaking-change');
              }
            }

            const triagedLabels = ['feature', 'bugfix', 'documentation', 'refactor', 'performance', 'breaking-change', 'chore', 'ci'];
            if (!triagedLabels.some(l => labelsToAdd.has(l)) && labelsToAdd.size === 0) {
              labelsToAdd.add('needs triage');
            }

            if (labelsToAdd.size > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, labels: Array.from(labelsToAdd),
                });
                console.log(`Added labels: ${Array.from(labelsToAdd).join(', ')}`);
              } catch (error) {
                console.log(`Could not add labels: ${error.message}`);
              }
            }

  check-attribution:
    name: Attribution Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate token for glycemicgpt-ci
        id: ci-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Detect AI attribution and classify severity
        id: detect
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true

          SEVERITY="NONE"
          FINDINGS=""

          ALLOWED_BOTS="github-actions\[bot\]|coderabbitai\[bot\]|glycemicgpt-security\[bot\]|glycemicgpt-ci\[bot\]|glycemicgpt-release\[bot\]|glycemicgpt-merge\[bot\]|glycemicgpt-renovate\[bot\]|dependabot\[bot\]|homebot-0\[bot\]|gitguardian\[bot\]"
          AI_TOOLS="claude|anthropic|copilot|chatgpt|openai|cursor|windsurf|codeium|codewhisperer|amazon\\.q|gemini|gemini\\.code\\.assist|jetbrains\\.ai|tabnine|sourcegraph|cody|devin|aider|codex"

          # Layer 1: Commit trailers
          echo "=== Layer 1: Checking commit message trailers ==="
          COMMIT_MESSAGES=$(git log --format="%B---COMMIT_SEP---" "origin/${BASE_REF}..HEAD" 2>/dev/null || true)

          BOT_TRAILERS=$(echo "$COMMIT_MESSAGES" | grep -iE "^Co-Authored-By:.*(\[bot\]|noreply@)" || true)
          if [ -n "$BOT_TRAILERS" ]; then
            while IFS= read -r line; do
              if ! echo "$line" | grep -qiE "$ALLOWED_BOTS"; then
                FINDINGS="${FINDINGS}| CRITICAL | commit trailer | \`${line}\` |\\n"
                SEVERITY="CRITICAL"
              fi
            done <<< "$BOT_TRAILERS"
          fi

          TOOL_TRAILERS=$(echo "$COMMIT_MESSAGES" | grep -iE "^Co-Authored-By:.*(${AI_TOOLS})" || true)
          if [ -n "$TOOL_TRAILERS" ]; then
            TOOL_ONLY=$(echo "$TOOL_TRAILERS" | grep -viE "(\[bot\]|noreply@)" || true)
            if [ -n "$TOOL_ONLY" ]; then
              while IFS= read -r line; do
                FINDINGS="${FINDINGS}| HIGH | commit trailer | \`${line}\` |\\n"
                [ "$SEVERITY" != "CRITICAL" ] && SEVERITY="HIGH"
              done <<< "$TOOL_ONLY"
            fi
          fi

          ALT_TRAILERS=$(echo "$COMMIT_MESSAGES" | grep -iE "^(Authored-By|Generated-By|AI-Generated-By):" || true)
          if [ -n "$ALT_TRAILERS" ]; then
            while IFS= read -r line; do
              FINDINGS="${FINDINGS}| HIGH | commit trailer | \`${line}\` |\\n"
              [ "$SEVERITY" != "CRITICAL" ] && SEVERITY="HIGH"
            done <<< "$ALT_TRAILERS"
          fi

          # Layer 2: Code comments
          echo "=== Layer 2: Checking code comments ==="
          COMMENT_PHRASES="generated by|generated with|written by|created by|built with|copilot suggestion|ai-generated|ai generated"
          DIFF_OUTPUT=$(git diff "origin/${BASE_REF}...HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.sh' 2>/dev/null || true)
          CODE_HITS=$(echo "$DIFF_OUTPUT" | grep '^+' | grep -v '^+++' | grep -inE "(${COMMENT_PHRASES}).*(${AI_TOOLS}|\\bai\\b|\\bgpt\\b)" || true)
          if [ -n "$CODE_HITS" ]; then
            FINDINGS="${FINDINGS}| MEDIUM | code comment | AI attribution in changed files ($(echo "$CODE_HITS" | wc -l) lines) |\\n"
            [ "$SEVERITY" = "NONE" ] && SEVERITY="MEDIUM"
          fi

          # Layer 3: PR description
          echo "=== Layer 3: Checking PR description ==="
          if [ -n "$PR_BODY" ]; then
            CLEAN_BODY=$(echo "$PR_BODY" | sed '/^<!-- This is an auto-generated comment: release notes by coderabbit.ai -->$/,$d; /^## Summary by CodeRabbit$/,$d')
            PR_PATTERN="generated with claude code|generated with.*(${AI_TOOLS})|built with.*\\bai\\b|claude\\.ai/claude-code|generated by (${AI_TOOLS})"
            if echo "$CLEAN_BODY" | grep -qiE "$PR_PATTERN"; then
              FINDINGS="${FINDINGS}| HIGH | PR description | AI tool branding detected |\\n"
              [ "$SEVERITY" != "CRITICAL" ] && SEVERITY="HIGH"
            fi
          fi

          echo "severity=${SEVERITY}" >> "$GITHUB_OUTPUT"
          echo "has_findings=$( [ "$SEVERITY" != "NONE" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          FINDINGS_FILE=$(mktemp)
          printf "%b" "$FINDINGS" > "$FINDINGS_FILE"
          echo "findings_file=${FINDINGS_FILE}" >> "$GITHUB_OUTPUT"

          echo "=== Result: severity=${SEVERITY} ==="
          if [ "$SEVERITY" != "NONE" ]; then
            echo "FAILED: AI attribution detected (${SEVERITY})."
            exit 1
          fi
          echo "PASSED: No AI attribution found."

      - name: Post attribution findings to PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.ci-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const severity = '${{ steps.detect.outputs.severity }}';
            const hasFindings = '${{ steps.detect.outputs.has_findings }}' === 'true';
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;

            const marker = '<!-- attribution-check-comment -->';
            const repo = context.repo;

            const comments = await github.rest.issues.listComments({
              ...repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.data.find(c => c.body?.includes(marker));

            let body;
            if (!hasFindings) {
              body = [marker, '## :white_check_mark: Attribution Check: Passed', '',
                'No AI attribution detected across commits, code, and PR description.',
                'Thanks for keeping our repo clean and taking ownership of your work.'].join('\n');
            } else {
              const fs = require('fs');
              let findingsTable = '';
              try { findingsTable = fs.readFileSync('${{ steps.detect.outputs.findings_file }}', 'utf8').trim(); } catch {}

              const emoji = { CRITICAL: ':red_circle:', HIGH: ':orange_circle:', MEDIUM: ':yellow_circle:' }[severity] || ':grey_question:';
              let instructions = severity === 'CRITICAL'
                ? 'This PR has been automatically closed. Create a new branch, cherry-pick without prohibited trailers, and open a new PR.'
                : 'Remove the AI attribution and push again. See CONTRIBUTING.md for details.';

              body = [marker, `## ${emoji} Attribution Check: ${severity}`, '',
                `AI tool attribution detected. See [attribution policy](https://github.com/${repo.owner}/${repo.repo}/blob/main/CONTRIBUTING.md#no-ai-attribution-in-code).`, '',
                '| Severity | Location | Finding |', '|----------|----------|---------|', findingsTable, '',
                '### How to Fix', '', instructions].join('\n');
            }

            if (existing) {
              await github.rest.issues.updateComment({ ...repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: prNumber, body });
            }

      - name: Auto-close PR on CRITICAL violation
        if: always() && steps.detect.outputs.severity == 'CRITICAL'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.ci-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) return;
            await github.rest.pulls.update({ ...context.repo, pull_number: prNumber, state: 'closed' });
            console.log(`Auto-closed PR #${prNumber} due to CRITICAL AI attribution violation`);
