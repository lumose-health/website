name: Docs Rebuild

# Triggered by source repos when their docs change.
# Source repos call: gh api repos/GlycemicGPT/website/dispatches -f event_type=docs-updated
on:
  repository_dispatch:
    types: [docs-updated]
  # Daily refresh so contributor counts and stars stay current.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Rebuild docs and deploy to production
    # This job always deploys to production. repository_dispatch and schedule
    # runs use the default branch; a manual run from any other branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync docs from source repos
        run: npm run sync-docs && npm run sync-contributors && npx fumadocs-mdx
        env:
          DOCS_NO_CACHE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npx next build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=lumose --branch=main --commit-message="${{ github.event_name == 'repository_dispatch' && format('docs rebuild (dispatched by {0}@{1})', github.event.client_payload.source, github.event.client_payload.sha) || format('docs rebuild ({0} by {1})', github.event_name, github.actor) }}"
