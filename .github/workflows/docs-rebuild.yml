name: Docs Rebuild

# Triggered by source repos when their docs change.
# Source repos call: gh api repos/lumose-health/website/dispatches -f event_type=docs-updated
on:
  repository_dispatch:
    types: [docs-updated]
  # Daily refresh so contributor counts and stars stay current.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Rebuild docs and deploy to production
    # This job always deploys to production. repository_dispatch and schedule
    # runs use the default branch; a manual run from any other branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync docs from source repos
        run: npm run sync-docs && npm run sync-contributors && npm run sync-releases && npm run sync-roadmap && npx fumadocs-mdx
        env:
          DOCS_NO_CACHE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npx next build

      # Checks the freshly synced data (banned words) and the build output
      # before anything goes live. A failure stops the deploy, and production
      # keeps the previous version.
      - name: Check build output and synced data
        run: bash scripts/check-v2.sh

      # The dispatch payload is whatever the sender put in it. Its values are
      # read from env, never expanded into this script, and kept only when they
      # match a strict pattern; anything else becomes "unknown". The message
      # placed in the wrangler command line can then hold no quotes, $,
      # backticks or newlines.
      - name: Build deploy message
        id: deploy-message
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          keep_if() {
            if [[ "$1" =~ $2 ]]; then printf '%s' "$1"; else printf 'unknown'; fi
          }
          event=$(keep_if "$EVENT_NAME" '^[a-z_]{1,50}$')
          actor=$(keep_if "$ACTOR" '^[A-Za-z0-9-]{1,39}(\[bot\])?$')
          source=$(keep_if "$PAYLOAD_SOURCE" '^[A-Za-z0-9._/-]{1,100}$')
          sha=$(keep_if "$PAYLOAD_SHA" '^[0-9a-f]{7,40}$')
          if [ "$event" = "repository_dispatch" ]; then
            message="docs rebuild (dispatched by ${source}@${sha})"
          else
            message="docs rebuild (${event} by ${actor})"
          fi
          # Last guard: only the characters the patterns above can produce.
          allowed='^[]A-Za-z0-9._/@()[ -]+$'
          if ! [[ "$message" =~ $allowed ]]; then
            message="docs rebuild"
          fi
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "Deploy message: $message"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=lumose --branch=main --commit-message="${{ steps.deploy-message.outputs.message }}"
