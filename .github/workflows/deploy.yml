name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy to production
    # This job always deploys to production. A manual run can be started from
    # any branch, so only main may deploy; a run from any other branch is skipped.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync docs from source repos
        run: npm run sync-docs && npm run sync-contributors && npm run sync-releases && npm run sync-roadmap && npx fumadocs-mdx
        env:
          DOCS_NO_CACHE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npx next build

      # Checks the freshly synced data (banned words) and the build output
      # before anything goes live. A failure stops the deploy, and production
      # keeps the previous version.
      - name: Check build output and synced data
        run: bash scripts/check-v2.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=lumose --branch=main --commit-hash=${{ github.sha }}
